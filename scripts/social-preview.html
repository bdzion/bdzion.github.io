<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<title>Academic website sharing preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;background:#fafbf8;color:#234b3a}
body{font-family:Arial,sans-serif;border-top:12px solid #234b3a;padding:58px 64px;display:grid;grid-template-columns:690px 330px;gap:48px}
.copy{display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.eyebrow{font-size:15px;font-weight:700;letter-spacing:1.4px;margin:0 0 24px;text-transform:uppercase;color:#52675a}
h1{font:700 57px/1.05 Georgia,serif;letter-spacing:-1.5px;margin:0 0 22px}
.role{font-size:23px;line-height:1.5;margin:0 0 28px;color:#324a3b}
.lab{font:700 31px/1.2 Georgia,serif;margin:0 0 12px}
.theme{font-size:23px;line-height:1.45;max-width:610px;margin:0;color:#324a3b}
.url{font-size:19px;font-weight:700;margin:30px 0 0;letter-spacing:.3px}
.photo{height:444px;width:330px;align-self:center;overflow:hidden;border-radius:3px}
.photo img{height:100%;width:100%;object-fit:cover;object-position:50% 12%;transform:scale(1.7);transform-origin:center top}
</style>
</head>
<body>
<main class="copy">
<p class="eyebrow">Environmental science · Geography · Decision science</p>
<h1>Md Bodrud-Doza, PhD</h1>
<p class="role">Postdoctoral Scholar<br>University of Guelph</p>
<p class="lab">REAL Decision Lab</p>
<p class="theme">Resilient agricultural landscapes,<br>water quality, and environmental decisions.</p>
<p class="url">bdzion.github.io</p>
</main>
<div class="photo"><img src="../assets/portrait.webp" alt="Md Bodrud-Doza on the University of Guelph campus"></div>
</body>
</html>
