project:
  type: website
  output-dir: _site
  pre-render:
    - python scripts/render_publications.py
    - python scripts/render_publication_timeline.py
    - python scripts/render_updates.py
  post-render: python scripts/finalize_html.py
  render:
    - "*.qmd"
  resources:
    - assets/images/**
    - assets/portrait.webp
    - assets/lab-logo.png
    - assets/social-preview.png
    - robots.txt
    - assets/Md_Bodrud_Doza_Academic_CV.pdf
    - publications.json
    - updates.json
website:
  title: "Md Bodrud-Doza"
  site-url: https://bdzion.github.io
  description: "Md Bodrud-Doza, PhD: watershed modelling, precision conservation, geospatial analysis and environmental decision support for agricultural landscapes."
  favicon: assets/favicon.svg
  image: assets/social-preview.png
  open-graph: true
  twitter-card: true
  navbar:
    background: light
    collapse-below: lg
    left:
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: teaching.qmd
        text: Teaching
      - href: cv.qmd
        text: CV
      - href: contact.qmd
        text: Contact
  page-footer:
    left: "Md Bodrud-Doza · University of Guelph, Canada"
    center:
      - text: Case studies
        href: projects.qmd
      - text: Research journey
        href: research-journey.qmd
      - text: Experience
        href: experience.qmd
      - text: Collaboration
        href: collaboration.qmd
    right:
      - text: Email
        href: mailto:mbodrudd@uoguelph.ca
      - text: Google Scholar
        href: https://scholar.google.com/citations?user=1VymNoIAAAAJ&hl=en
      - text: ORCID
        href: https://orcid.org/0000-0003-4694-4077
      - text: GitHub
        href: https://github.com/bdzion
  search:
    location: navbar
    type: overlay
format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    lang: en-CA
    link-external-newwindow: true
    include-before-body: assets/before-body.html
    include-after-body: assets/site.js.html
    smooth-scroll: false
